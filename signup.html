<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — FlashPrep Kits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand-navy: #1E234B;      
  --brand-yellow: #FFC83D;    
  --brand-purple: #7C73F9;    
  --brand-teal: #3CC0A1;
  --brand-red: #FF7E7E;
  --surface: #F9FAFF;
  --white: #FFFFFF;
  --muted: #6E7191;
  --border: #1E234B;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Poppins', sans-serif; 
  background: var(--surface); 
  color: var(--brand-navy); 
  min-height: 100vh; 
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  line-height: 1.6;
}

/* DECORATIVE BACKGROUND ELEMENTS */
.bg-shape { position: fixed; z-index: -1; border: 4px solid var(--brand-navy); background: var(--white); }
.shape-1 { width: 120px; height: 120px; border-radius: 50%; bottom: -30px; left: -30px; background: var(--brand-teal); box-shadow: 6px 6px 0px var(--brand-navy); }
.shape-2 { width: 150px; height: 150px; border-radius: 20px; top: 5%; right: 2%; background: var(--brand-purple); transform: rotate(-10deg); box-shadow: 6px 6px 0px var(--brand-navy); }

/* MAIN CONTAINER */
.signup-wrapper {
  width: 100%;
  max-width: 480px;
}

/* LOGO */
.logo { display: flex; align-items: center; justify-content: center; gap: 0.8rem; text-decoration: none; font-weight: 800; font-size: 1.5rem; color: var(--brand-navy); margin-bottom: 2rem; }
.logo img { width: 42px; height: 42px; object-fit: contain; }
.logo span { color: var(--brand-purple); }

/* SIGNUP CARD */
.signup-card {
  background: var(--white);
  border: 4px solid var(--brand-navy);
  border-radius: 24px;
  padding: 3rem 2.5rem;
  box-shadow: 12px 12px 0px var(--brand-navy);
  text-align: center;
}

.signup-card h1 { font-weight: 800; font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--brand-navy); }
.signup-card p { font-size: 0.95rem; color: var(--muted); font-weight: 500; margin-bottom: 2rem; }

/* FORMS */
.form-group { margin-bottom: 1.2rem; text-align: left; }
.form-group label { display: block; font-weight: 700; margin-bottom: 0.4rem; color: var(--brand-navy); font-size: 0.9rem; }
.form-control { 
  width: 100%; 
  padding: 0.9rem 1.2rem; 
  border: 2px solid var(--brand-navy); 
  border-radius: 12px; 
  font-family: 'Poppins', sans-serif; 
  font-size: 1rem; 
  font-weight: 500; 
  background: var(--surface);
  transition: 0.2s;
}
.form-control:focus { outline: none; border-color: var(--brand-teal); background: var(--white); box-shadow: 4px 4px 0px var(--brand-teal); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

/* OPTIONS */
.form-options { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 2rem; font-size: 0.85rem; font-weight: 600; text-align: left; color: var(--brand-navy); }
.form-options a { color: var(--brand-purple); text-decoration: none; }
.form-options a:hover { text-decoration: underline; }

/* BUTTONS */
.btn-primary { 
  width: 100%;
  background: var(--brand-teal); 
  color: var(--white); 
  border: 2px solid var(--brand-navy);
  padding: 1rem; 
  border-radius: 12px; 
  font-weight: 800; 
  font-size: 1.1rem;
  box-shadow: 4px 4px 0px var(--brand-navy); 
  cursor: pointer;
  transition: 0.2s;
  font-family: 'Poppins', sans-serif;
  text-shadow: 1px 1px 0px var(--brand-navy);
}
.btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--brand-navy); }

/* FOOTER TEXT */
.signup-footer { margin-top: 1.5rem; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.signup-footer a { color: var(--brand-navy); font-weight: 800; text-decoration: none; }
.signup-footer a:hover { text-decoration: underline; }

/* BACK TO HOME */
.back-home { display: inline-block; margin-top: 2rem; font-size: 0.85rem; font-weight: 700; color: var(--muted); text-decoration: none; transition: 0.2s; }
.back-home:hover { color: var(--brand-navy); }
</style>
</head>
<body>

<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>

<div class="signup-wrapper">
  
  <a class="logo" href="index.html">
    <img src="images/logo-kits.png" alt="FlashPrep Logo" onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('afterbegin', '🧠');">
    <div>flashprep<span>kits</span></div>
  </a>

  <div class="signup-card">
    <h1>Create your account 🚀</h1>
    <p>Start reviewing smarter for your IT subjects.</p>

    <form id="signupForm">
      
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" class="form-control" placeholder="e.g. Christian Perez" required>
      </div>

      <div class="form-group">
        <label for="email">Student Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@students.nu.edu.ph" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-options">
        <input type="checkbox" id="terms" style="margin-top: 0.2rem; width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand-navy);" required>
        <label for="terms" style="cursor: pointer; margin-bottom: 0;">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </label>
      </div>

      <button type="submit" class="btn-primary">Create Free Account</button>
    </form>

    <div class="signup-footer">
      Already have an account? <a href="login.html">Log in here</a>
    </div>
  </div>

  <div style="text-align: center;">
    <a href="index.html" class="back-home">← Back to Home</a>
  </div>

</div>

<script>
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    // Simulate loading state
    const btn = document.querySelector('.btn-primary');
    btn.textContent = 'Creating account...';
    btn.style.opacity = '0.8';

    // Redirect to dashboard
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 600);
  });
</script>

</body>
</html>
