<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Kits — FlashPrep Kits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand-navy: #1E234B;      
  --brand-yellow: #FFC83D;    
  --brand-purple: #7C73F9;    
  --brand-teal: #3CC0A1;
  --brand-red: #FF7E7E;
  --surface: #F9FAFF;
  --white: #FFFFFF;
  --muted: #6E7191;
  --border: #1E234B;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Poppins', sans-serif; 
  background: var(--surface); 
  color: var(--brand-navy); 
  min-height: 100vh; 
  line-height: 1.6;
}

/* NAV */
nav {
  position: sticky; top: 0; z-index: 1000;
  background: rgba(255, 255, 255, 0.95);  
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 6%; border-bottom: 2px solid var(--brand-navy);
}
.logo { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; font-weight: 800; font-size: 1.2rem; color: var(--brand-navy); cursor: pointer; }
.logo img { width: 34px; height: 34px; object-fit: contain; }
.logo span { color: var(--brand-purple); }

.nav-right { display: flex; align-items: center; gap: 1.5rem; }
.btn-nav-outline { font-size: 0.9rem; font-weight: 800; color: var(--brand-navy); text-decoration: none; transition: 0.2s; padding: 0.5rem 1rem; border: 2px solid var(--brand-navy); border-radius: 8px; box-shadow: 2px 2px 0px var(--brand-navy); background: var(--white); }
.btn-nav-outline:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--brand-navy); }

/* HERO BANNER */
.store-hero {
  background: var(--brand-navy);
  padding: 4rem 6% 3rem;
  text-align: center;
  color: white;
  border-bottom: 8px solid var(--brand-purple);
}
.store-hero h1 { font-weight: 800; font-size: 2.8rem; margin-bottom: 0.5rem; letter-spacing: -1px; }
.store-hero h1 span { color: var(--brand-yellow); }
.store-hero p { font-size: 1.1rem; opacity: 0.8; font-weight: 500; max-width: 600px; margin: 0 auto; }

/* LAYOUT & FILTERS */
.store-container { padding: 3rem 6%; max-width: 1400px; margin: 0 auto; }

.filter-bar {
  display: flex; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap; justify-content: center;
}
.filter-btn {
  padding: 0.6rem 1.5rem; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s; 
  border: 2px solid var(--brand-navy); background: var(--white); color: var(--muted); font-family: 'Poppins', sans-serif;
  box-shadow: 2px 2px 0px rgba(30, 35, 75, 0.1);
}
.filter-btn:hover { color: var(--brand-navy); transform: translate(-1px, -1px); box-shadow: 3px 3px 0px rgba(30, 35, 75, 0.2); }
.filter-btn.active { background: var(--brand-navy); color: white; border-color: var(--brand-navy); box-shadow: 4px 4px 0px var(--brand-yellow); }

/* PRODUCT GRID */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }

/* PRODUCT CARD */
.p-card {
  background: var(--white); border: 2px solid var(--brand-navy);
  border-radius: 20px; padding: 2rem; position: relative;
  transition: 0.2s; box-shadow: 6px 6px 0px var(--brand-navy);
  display: flex; flex-direction: column;
}
.p-card:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px var(--brand-navy); }
.p-icon { font-size: 2.5rem; margin-bottom: 1rem; background: var(--surface); width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 16px; border: 2px solid var(--brand-navy); }
.p-subject { font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--brand-purple); margin-bottom: 0.3rem; }
.p-name { font-weight: 800; font-size: 1.3rem; margin-bottom: 0.5rem; line-height: 1.2; }
.p-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; font-weight: 500; flex-grow: 1; }

.p-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; border-top: 2px dashed rgba(30, 35, 75, 0.1); padding-top: 1.5rem; }
.p-price { font-weight: 800; font-size: 1.4rem; color: var(--brand-navy); }
.p-btn-buy { font-size: 0.9rem; font-weight: 800; padding: 0.6rem 1.2rem; border-radius: 8px; border: 2px solid var(--brand-navy); background: var(--brand-yellow); color: var(--brand-navy); cursor: pointer; text-decoration: none; transition: 0.2s; box-shadow: 2px 2px 0px var(--brand-navy); font-family: 'Poppins', sans-serif;}
.p-btn-buy:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--brand-navy); }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(30, 35, 75, 0.8); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; }
.modal-content { background: var(--white); border: 4px solid var(--brand-navy); border-radius: 24px; padding: 3rem 2.5rem; width: 90%; max-width: 450px; text-align: center; box-shadow: 12px 12px 0px var(--brand-navy); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
.modal-content h3 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--brand-navy);}
.modal-content p { font-size: 1rem; color: var(--muted); margin-bottom: 2.5rem; font-weight: 500; }
.modal-actions { display: flex; gap: 1rem; justify-content: center; }
.btn-modal-cancel { background: var(--surface); border: 2px solid var(--brand-navy); padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 0px var(--brand-navy); font-family: 'Poppins', sans-serif;}
.btn-modal-confirm { background: var(--brand-teal); color: var(--white); border: 2px solid var(--brand-navy); padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 0px var(--brand-navy); font-family: 'Poppins', sans-serif; text-shadow: 1px 1px 0px var(--brand-navy);}
.btn-modal-cancel:hover, .btn-modal-confirm:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px var(--brand-navy); }

/* SEMESTER CTA BANNER */
.semester-cta { background: var(--brand-yellow); border: 4px solid var(--brand-navy); border-radius: 20px; padding: 3rem; margin-bottom: 4rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2rem; box-shadow: 8px 8px 0px var(--brand-navy); }
.cta-text h2 { font-weight: 800; font-size: 2rem; margin-bottom: 0.5rem; }
.cta-text p { font-weight: 600; font-size: 1.1rem; color: var(--brand-navy); opacity: 0.8; }
.cta-btn { background: var(--brand-navy); color: white; padding: 1rem 2rem; border-radius: 12px; font-weight: 800; font-size: 1.1rem; border: 2px solid var(--brand-navy); text-decoration: none; transition: 0.2s; box-shadow: 4px 4px 0px rgba(0,0,0,0.3); }
.cta-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <img src="images/logo-kits.png" alt="FlashPrep Logo" onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('afterbegin', '🧠');">
    <div>flashprep<span>kits</span></div>
  </a>
  <div class="nav-right">
    <a href="dashboard.html" class="btn-nav-outline">Go to Dashboard</a>
  </div>
</nav>

<div class="store-hero">
  <h1>Browse <span>Study Kits</span></h1>
  <p>Pay only for the subjects and materials you need to pass this semester.</p>
</div>

<div class="store-container">

  <!-- CTA BANNER -->
  <div class="semester-cta">
    <div class="cta-text">
      <h2>Want everything? Get Semester Access.</h2>
      <p>Unlock all 20 kits across 4 IT subjects instantly for just ₱999.</p>
    </div>
    <a href="dashboard.html?plan=semester" class="cta-btn">Unlock All Kits →</a>
  </div>

  <!-- FILTERS -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterStore('All')">All Subjects</button>
    <button class="filter-btn" onclick="filterStore('COSC 211')">🌳 COSC 211 (DSA)</button>
    <button class="filter-btn" onclick="filterStore('COSC 213')">🌐 COSC 213 (Networks)</button>
    <button class="filter-btn" onclick="filterStore('COSC 215')">🗄️ COSC 215 (DBMS)</button>
    <button class="filter-btn" onclick="filterStore('COSC 221')">💾 COSC 221 (OS)</button>
  </div>

  <!-- PRODUCT GRID -->
  <div class="product-grid" id="productGrid">
    <!-- Injected via JS -->
  </div>

</div>

<!-- BUY MODAL -->
<div class="modal-overlay" id="buyModal">
  <div class="modal-content">
    <span class="modal-icon">🛒</span>
    <h3>Confirm Purchase</h3>
    <p>You are about to purchase <strong id="modalKitName" style="color: var(--brand-purple);"></strong> for <strong id="modalKitPrice" style="color: var(--brand-navy);"></strong>.</p>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-modal-confirm" onclick="confirmPurchase()">Pay via GCash</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const SUBJECTS = [
  { code: 'COSC 211', name: 'Data Structures & Algorithms' },
  { code: 'COSC 213', name: 'Computer Networks' },
  { code: 'COSC 215', name: 'Database Management' },
  { code: 'COSC 221', name: 'Operating Systems' },
];

const KIT_TYPES = [
  { id: 'flashcard', name: 'Flash Cards', icon: '🃏', desc: '200+ cards with spaced repetition built directly into your dashboard.', price: 99 },
  { id: 'reviewer', name: 'Mini Reviewer', icon: '📋', desc: 'Condensed chapter summaries mapped to your NU Clark syllabus.', price: 129 },
  { id: 'practice', name: 'Practice Questions', icon: '✏️', desc: '100+ questions mimicking actual assessments with detailed explanations.', price: 149 },
  { id: 'conceptmap', name: 'Concept Maps', icon: '🗺️', desc: 'Visual relationship diagrams to help you connect complex topics.', price: 99 },
  { id: 'coding', name: 'Coding Drills', icon: '🖥️', desc: 'Hands-on programming drills with guided solutions (Java/Python).', price: 179 },
];

// Generate Full Store Inventory
let STORE_ITEMS = [];
SUBJECTS.forEach(sub => {
  KIT_TYPES.forEach(kit => {
    STORE_ITEMS.push({
      subjectCode: sub.code,
      subjectName: sub.name,
      kitId: kit.id,
      kitName: kit.name,
      icon: kit.icon,
      desc: kit.desc,
      price: kit.price
    });
  });
});

let currentFilter = 'All';
let pendingPurchase = null;

// ── RENDER STORE ──────────────────────────────────────────────────────────────
function filterStore(subjectCode) {
  currentFilter = subjectCode;
  
  // Update active button state
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent.includes(subjectCode) || (subjectCode === 'All' && btn.textContent === 'All Subjects')) {
      btn.classList.add('active');
    }
  });

  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('productGrid');
  let html = '';

  const filteredItems = currentFilter === 'All' 
    ? STORE_ITEMS 
    : STORE_ITEMS.filter(item => item.subjectCode === currentFilter);

  filteredItems.forEach((item, index) => {
    html += `
      <div class="p-card">
        <div class="p-icon">${item.icon}</div>
        <div class="p-subject">${item.subjectCode}</div>
        <div class="p-name">${item.kitName}</div>
        <div class="p-desc">${item.desc}</div>
        <div class="p-footer">
          <div class="p-price">₱${item.price}</div>
          <button class="p-btn-buy" onclick="openBuyModal('${item.subjectCode}', '${item.kitName}', ${item.price})">Add to Plan</button>
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

// ── MODAL LOGIC ───────────────────────────────────────────────────────────────
function openBuyModal(subCode, kitName, price) {
  pendingPurchase = { subCode, kitName, price };
  document.getElementById('modalKitName').textContent = `${subCode} - ${kitName}`;
  document.getElementById('modalKitPrice').textContent = `₱${price}`;
  document.getElementById('buyModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('buyModal').style.display = 'none';
  pendingPurchase = null;
}

function confirmPurchase() {
  const btn = document.querySelector('.btn-modal-confirm');
  btn.textContent = 'Processing...';
  btn.style.opacity = '0.8';

  // Simulate API delay, then redirect to dashboard simulating a 'perkit' unlock
  setTimeout(() => {
    // In a real app, we'd pass data to backend. For prototype, we route to dashboard.
    window.location.href = 'dashboard.html?plan=perkit';
  }, 800);
}

// Initialize
renderGrid();
</script>
</body>
</html>
